replicaCount: 1

image:
  repository: order-processor
  tag: "v1"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

terminationGracePeriodSeconds: 30

db:
  host: orders-db.internal
  existingSecret: "order-processor-db"
  passwordKey: password


monitoring:
  enabled: false
  prometheusRelease: kube-prometheus-stack