{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-order-processor
  labels:
    app: order-processor
    release: {{ .Values.monitoring.prometheusRelease | quote }}
spec:
  selector:
    matchLabels:
      app: order-processor
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
  {{- end }}
