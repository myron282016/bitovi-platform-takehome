apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-order-processor
  labels:
    app: order-processor
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: order-processor
  template:
    metadata:
      labels:
        app: order-processor
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: order-processor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: {{ .Values.db.host }}
            - name: DB_PASSWORD
              value: {{ .Values.db.password }}
          livenessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
