apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-processor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/myron282016/bitovi-platform-takehome.git
    targetRevision: master
    path: charts
    helm:
      releaseName: order-processor
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
